name: yaz-ai

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: yaz
      POSTGRES_PASSWORD: yaz
      POSTGRES_DB: yaz_ai
    ports:
      - "5432:5432"
    volumes:
      - ./.docker/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yaz -d yaz_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./.docker/redis:/data

  # Local, self-hosted AI provider (AI_PROVIDER="ollama" in .env) — real
  # LLM tool-calling with nothing leaving this machine, no API key, no
  # per-message cost. See src/services/ai/providers/ollama.ts.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./.docker/ollama:/root/.ollama
